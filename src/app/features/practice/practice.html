@let t = language.ui();
<h1>{{ t.practice.heading }}</h1>
@if (session(); as list) {
  <p class="lead">
    {{ t.practice.running }}
    <button type="button" class="btn small" (click)="stop()">{{ t.practice.change }}</button>
  </p>
  <app-quiz-runner [questions]="list" mode="practice" [title]="sessionTitle()" feedback="instant" (finished)="finish($event)" />
} @else {
  <p class="lead">{{ t.practice.lead }}</p>
  <form class="card stack" [formGroup]="form" (ngSubmit)="start()">
    <div class="form-grid">
      <label class="field">
        <span>{{ t.common.domain }}</span>
        <select formControlName="domain">
          <option value="all">{{ t.practice.allDomains }}</option>
          @for (d of domains; track d.id) {
            <option [value]="d.id">{{ d.id }} · {{ language.domain(d) }}</option>
          }
        </select>
      </label>
      <label class="field">
        <span>{{ t.common.section }}</span>
        <select formControlName="section">
          <option value="all">{{ t.practice.allSections }}</option>
          @for (s of sectionOptions(); track s.id) {
            <option [value]="s.id">{{ s.id }} {{ language.section(s) }}</option>
          }
        </select>
      </label>
      <label class="field">
        <span>{{ t.common.level }}</span>
        <select formControlName="level">
          <option value="all">{{ t.practice.allLevels }}</option>
          @for (l of levels; track l) {
            <option [value]="l">{{ t.difficulty[l] }}</option>
          }
        </select>
      </label>
      <label class="field">
        <span>{{ t.practice.questionType }}</span>
        <select formControlName="type">
          <option value="all">{{ t.practice.allTypes }}</option>
          @for (type of types; track type) {
            <option [value]="type">{{ t.types[type] }}</option>
          }
        </select>
      </label>
      <label class="field">
        <span>{{ t.common.questions }}</span>
        <select formControlName="source">
          <option value="all">{{ t.common.allQuestions }}</option>
          <option value="new">{{ t.common.onlyNew }}</option>
          <option value="mistakes">{{ t.common.onlyMistakes }}</option>
        </select>
      </label>
    </div>
    <div>
      <button type="submit" class="btn primary" [disabled]="matching().length === 0">
        {{ t.practice.start(matching().length) }}
      </button>
      @if (matching().length === 0) {
        <span class="muted"> {{ t.practice.empty }}</span>
      }
    </div>
  </form>
}
